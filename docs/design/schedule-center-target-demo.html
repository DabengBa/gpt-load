<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调度中心 · 目标 Demo</title><style>:root{--bg:#f5f7fb;--ink:#192536;--muted:#6d7a8d;--line:#dfe6ef;--blue:#2563eb;--green:#16845b;--amber:#a56400;--red:#bf3848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,sans-serif}.bar{height:62px;background:#172235;color:#c5d0e1;display:flex;align-items:center;gap:28px;padding:0 28px}.brand{font-size:17px;color:#fff}.active{color:#fff}.main{padding:27px 30px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{font-size:25px;margin:0}.head p{color:var(--muted);margin:4px 0 0}.filters{display:flex;gap:8px;align-items:center}.select,.search{border:1px solid #d1dbe8;border-radius:6px;background:#fff;padding:8px 10px;font:inherit;color:var(--ink)}.search{width:190px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted)}.toolbar b{color:var(--ink)}.btn{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 12px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:auto;box-shadow:0 12px 30px #17223508}.table{min-width:920px}.tr{display:grid;grid-template-columns:1.35fr 1.25fr 105px 92px 110px 105px 110px;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line)}.tr:last-child{border:0}.th{background:#f8fafc;color:var(--muted);font-size:11px;font-weight:700;position:sticky;top:0}.td strong{display:block}.muted{font-size:11px;color:var(--muted)}.cell-input{width:62px;border:1px solid #cbd7e5;border-radius:5px;padding:6px 7px;font:inherit;background:#fff}.cell-input:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}.share{font-weight:750;color:var(--blue)}.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green);font-weight:700}.state.warn{color:var(--amber)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.pill{display:inline-block;padding:3px 7px;border-radius:5px;background:#eef2f7;color:#526174;font-size:11px}.pill.warn{background:#fff7e6;color:var(--amber)}.pill.red{background:#fff0f1;color:var(--red)}.inline{display:flex;gap:8px;align-items:center}.help{color:var(--muted);cursor:help;border-bottom:1px dotted}.notice{margin-top:11px;color:var(--muted);font-size:11px}.saved{color:var(--green);font-weight:700}@media(max-width:800px){.main{padding:22px 14px}.head{display:block}.filters{margin-top:13px;flex-wrap:wrap}.search{width:100%}.toolbar{align-items:flex-start;gap:10px}.tr{grid-template-columns:1.3fr 1.2fr 80px 70px 95px 95px 90px;padding:9px 11px}}</style></head><body><header class="bar"><b class="brand">GPT-Load</b><span>首页</span><span>分组</span><span class="active">监控 / 调度中心</span><span>访问密钥</span></header><main class="main"><div class="head"><div><h1>模型调度中心</h1></div><div class="filters"><select class="select"><option>GPT-4o</option><option>GPT-4o Mini</option><option>o3</option></select></div></div><div class="toolbar"><span><b>GPT-4o</b>　3 个候选</span><div class="inline"><span id="msg"></span><button class="btn primary" onclick="save(this)">保存</button></div></div><div class="table-wrap"><div class="table"><div class="tr th"><div>分组</div><div>上游模型</div><div>权重</div><div>优先级</div><div>当前占比</div><div>状态</div><div>熔断</div></div><div class="tr"><div class="td"><strong>OpenAI Production</strong><span class="muted">可用</span></div><div class="td"><strong>gpt-4o</strong><span class="muted">GPT-4o</span></div><div><input class="cell-input" value="70"></div><div><input class="cell-input" value="1"></div><div class="share">70.0%</div><div class="state"><i class="dot"></i>可用</div><div><span class="pill">默认</span></div></div><div class="tr"><div class="td"><strong>OpenAI Staging</strong><span class="muted">可用</span></div><div class="td"><strong>gpt-4o</strong><span class="muted">GPT-4o Staging</span></div><div><input class="cell-input" value="30"></div><div><input class="cell-input" value="1"></div><div class="share">30.0%</div><div class="state"><i class="dot"></i>可用</div><div><span class="pill">默认</span></div></div><div class="tr"><div class="td"><strong>OpenAI Backup</strong><span class="muted">冷却中</span></div><div class="td"><strong>gpt-4o</strong><span class="muted">GPT-4o Backup</span></div><div><input class="cell-input" value="100"></div><div><input class="cell-input" value="2"></div><div class="muted">备用层</div><div class="state warn"><i class="dot"></i>冷却 12m</div><div><button class="btn" onclick="recover(this)">恢复</button></div></div></div></div></main><script>function save(b){b.textContent='已保存';b.style.background='#16845b';document.getElementById('msg').textContent='调度已更新';setTimeout(()=>{b.textContent='保存';b.style.background='';document.getElementById('msg').textContent=''},1400)}function recover(b){b.textContent='已恢复';b.className='btn';setTimeout(()=>b.textContent='恢复',1200)}</script></body></html>
