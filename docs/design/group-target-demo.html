<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分组 · 目标 Demo</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#192536;--muted:#6d7a8d;--line:#e2e8f0;--blue:#2563eb;--green:#16845b;--red:#bf3848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}.bar{height:64px;background:#172235;color:#c5d0e1;display:flex;align-items:center;gap:30px;padding:0 30px}.brand{font-weight:800;color:#fff;font-size:17px}.nav.active{color:#fff}.main{max-width:1100px;margin:auto;padding:29px 28px 60px}.crumb{font-size:12px;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}.head h1{font-size:27px;margin:0}.head p{margin:4px 0 0;color:var(--muted)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:#fff;font-weight:650}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:15px;box-shadow:0 12px 32px #17223508}.section{padding:19px 21px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.title h2{font-size:15px;margin:0}.form{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:15px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.input,.select{width:100%;padding:9px 10px;border:1px solid #d6deea;border-radius:7px;background:#fff;font:inherit}.toggle{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700;padding-top:8px}.dot{height:8px;width:8px;border-radius:50%;background:currentColor}.credential{display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:15px}.credential strong{display:block}.sub{font-size:12px;color:var(--muted)}.health{color:var(--green);font-weight:700;font-size:13px}.model-head,.model{display:grid;grid-template-columns:1.25fr 1fr 100px 92px 92px;gap:12px;align-items:center;padding:12px 21px}.model-head{background:#fafbfd;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.model{border-bottom:1px solid var(--line)}.model:last-child{border-bottom:0}.model strong{display:block}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:#eef2f7;color:#4d5c70;font-size:12px}.link{color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}.advanced{margin-top:15px}.advanced summary{padding:16px 21px;cursor:pointer;font-weight:700;color:#405066}.advanced[open] summary{border-bottom:1px solid var(--line)}.advanced .form{padding:18px 21px}.advanced .wide{grid-column:1/-1}.hint{color:var(--muted);font-size:12px;margin-top:5px}.footer{color:var(--muted);font-size:12px;margin:17px 2px}@media(max-width:720px){.bar{padding:0 15px;gap:16px}.nav:not(.active){display:none}.main{padding:22px 14px}.head{align-items:start;gap:14px}.head .btn{white-space:nowrap}.form{grid-template-columns:1fr}.model-head,.model{grid-template-columns:1.2fr 90px 65px;gap:8px;padding:12px}.model-head :nth-child(2),.model :nth-child(2),.model-head :nth-child(5),.model :nth-child(5){display:none}.credential{align-items:flex-start;flex-direction:column;gap:6px}}</style></head><body><header class="bar"><b class="brand">GPT-Load</b><span class="nav">首页</span><span class="nav active">分组</span><span class="nav">调度中心</span><span class="nav">访问密钥</span></header><main class="main"><div class="crumb">分组 / OpenAI Production</div><div class="head"><div><h1>OpenAI Production</h1></div><button class="btn primary" onclick="saved(this)">保存</button></div><section class="card"><div class="section"><div class="title"><h2>基础配置</h2><span class="toggle"><i class="dot"></i>已启用</span></div><div class="form"><div class="field"><label>分组名称</label><input class="input" value="OpenAI Production"></div><div class="field"><label>渠道</label><select class="select"><option>OpenAI</option></select></div><div class="field"><label>连接类型</label><input class="input" value="API Key" disabled></div></div></div><div class="section"><div class="title"><h2>凭据</h2></div><div class="credential"><div><strong>sk-prod-••••7Q2</strong><span class="sub">API Key</span></div><span class="health">● 可用</span><button class="btn" onclick="alert('打开凭据管理')">管理</button></div></div></section><section class="card"><div class="section"><div class="title"><div><h2>模型</h2></div><button class="btn">添加模型</button></div></div><div class="model-head"><div>对外模型</div><div>上游模型</div><div>权重</div><div>优先级</div><div></div></div><div class="model"><div><strong>GPT-4o</strong></div><div class="sub">gpt-4o</div><div><span class="badge">70</span></div><div><span class="badge">P1</span></div><div class="link" onclick="location.href='schedule-center-target-demo.html'">调度</div></div><div class="model"><div><strong>GPT-4o Mini</strong></div><div class="sub">gpt-4o-mini</div><div><span class="badge">100</span></div><div><span class="badge">P1</span></div><div class="link" onclick="location.href='schedule-center-target-demo.html'">调度</div></div><div class="model"><div><strong>o3</strong></div><div class="sub">o3</div><div><span class="badge">100</span></div><div><span class="badge">P2</span></div><div class="link" onclick="location.href='schedule-center-target-demo.html'">调度</div></div></section><details class="card advanced"><summary>高级配置</summary><div class="form"><div class="field wide"><label>分组代理</label><input class="input" placeholder="未设置：直连或使用环境代理"><div class="hint">作用于此分组唯一凭据发出的全部上游请求。</div></div><div class="field"><label>请求超时（秒）</label><input class="input" value="120"></div><div class="field"><label>失败重试次数</label><input class="input" value="2"></div></div></details></main><script>function saved(b){b.textContent='已保存';b.style.background='#16845b';setTimeout(()=>{b.textContent='保存';b.style.background=''},1200)}</script></body></html>
