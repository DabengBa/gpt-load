<body>
<header class="top"><span class="brand">监控</span><span class="nav">总览</span><span class="nav on">用量明细</span><span class="nav">日志</span></header>
<main class="wrap"><div class="title"><h1>用量明细</h1><button class="refresh" onclick="location.reload()">⟳ 刷新</button></div>
<section class="filters"><div class="field"><label>时间范围</label><select><option>24 小时</option></select></div><div class="field"><label>分组</label><select><option>全部分组</option></select></div><div class="field grow"><label>上游模型</label><select><option>全部上游模型</option></select></div><button class="apply">应用</button><button class="reset" onclick="document.querySelectorAll('select').forEach(x=>x.selectedIndex=0)">重置</button></section>
<div class="tabs" role="tablist" aria-label="尝试指标展示方案"><button class="tab" role="tab" aria-selected="true" data-view="a">A · 状态拆分</button><button class="tab" role="tab" aria-selected="false" data-view="b">B · 成功率主导</button><button class="tab" role="tab" aria-selected="false" data-view="c">C · 层级合并</button></div>
<p class="note" id="explain">尝试总数是基数；失败次数是其中的子集。正常、缓慢、故障是统计分类，分类之间不保证相加等于总数；成功率独立按请求口径计算。</p>

const config={a:{headers:['模型','分组','尝试数','尝试失败','正常尝试','缓慢尝试','故障尝试','成功率','平均请求耗时','平均请求首响','缓存率','Token 总数','Token 效率','预估成本'],cell:r=>`<td class="attempts"><span class="primary-num">${r.n.toLocaleString()}</span></td><td>${r.f}</td><td class="good">${r.ok.toLocaleString()}</td><td class="neutral">${r.slow}</td><td class="bad">${r.fault}</td><td class="rate">${r.rate}</td>`},b:{headers:['模型','分组','尝试数','失败尝试','正常尝试','缓慢尝试','故障尝试','请求成功率','平均请求耗时','平均请求首响','缓存率','Token 总数','Token 效率','预估成本'],cell:r=>`<td class="attempts"><span class="primary-num">${r.n.toLocaleString()}</span><small>总尝试</small></td><td>${r.f}</td><td class="good">${r.ok.toLocaleString()}</td><td class="neutral">${r.slow}</td><td class="bad">${r.fault}</td><td class="rate ${parseFloat(r.rate)<95?'bad':'good'}">${r.rate}</td>`},c:{headers:['模型','分组','尝试数','失败次数','状态计数（正常 / 缓慢 / 故障）','正常尝试','缓慢尝试','故障尝试','请求成功率','平均请求耗时','平均请求首响','缓存率','Token 总数','Token 效率','预估成本'],cell:r=>`<td class="attempts"><span class="primary-num">${r.n.toLocaleString()}</span></td><td>${r.f}</td><td class="barcell"><div class="split"><span><i class="seg-ok">正常</i><b>${r.ok.toLocaleString()}</b></span><span><i class="seg-slow">缓慢</i><b>${r.slow}</b></span><span><i class="seg-fault">故障</i><b>${r.fault}</b></span></div></td><td class="good">${r.ok.toLocaleString()}</td><td class="neutral">${r.slow}</td><td class="bad">${r.fault}</td><td class="rate ${parseFloat(r.rate)<95?'bad':'good'}">${r.rate}</td>`}};
function render(which){const c=config[which];document.querySelector('#headers').innerHTML=c.headers.map(x=>`<th>${x}</th>`).join('');document.querySelector('#rows').innerHTML=data.map(r=>`<tr><td><b>${r.model}</b></td><td><a class="group" href="/groups/${r.id}" title="打开分组维护">${r.group}</a></td>${c.cell(r)}<td>${r.dur}</td><td>${r.first}</td><td>${r.cache}</td><td class="metric">${r.tokens}</td><td class="metric" title="输出 Token ÷ 平均请求耗时">${r.eff}</td><td>${r.cost}</td></tr>`).join('');document.querySelector('#total').innerHTML=`<tr><td>总计</td><td>—</td><td class="attempts"><span class="primary-num">12,716</span></td><td>688</td>${which==='c'?'<td class="barcell"><div class="split"><span>正常 <b>11,137</b></span><span>缓慢 <b>339</b></span><span>故障 <b>704</b></span></div></td>':''}<td class="good">11,137</td><td>339</td><td class="bad">704</td><td class="rate">99.7%</td><td>12.3 s</td><td>7.5 s</td><td>89.0%</td><td class="metric">658.9M</td><td class="metric" title="输出 Token 8.3M ÷ 平均请求耗时 12.3 s">674.8K</td><td>$367.23</td></tr>`;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===which?'true':'false'));document.querySelector('#explain').textContent=which==='a'?'尝试总数是基数；失败次数是其中的子集。正常、缓慢、故障是统计分类，分类之间不保证相加等于总数；成功率独立按请求口径计算。':which==='b'?'强调业务结果：成功率作为核心结论；尝试量及状态计数作为诊断信息。失败次数属于尝试总量，状态分类也不是彼此互斥的总量拆分。':'将三种状态计数合并在一个单元格，保留“失败次数”为尝试总量的子集；分类不画成比例堆叠，避免暗示互斥或加总关系。成功率仍按请求口径计算。'}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));render('a');
