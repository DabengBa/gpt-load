const STATUS_LABEL = { available: "可用", disabled: "禁用", unavailable: "不可用" };
const tbody = document.getElementById("tbody");
const q = document.getElementById("q");
const pillsBox = document.getElementById("pills");
const meta = document.getElementById("meta");

const statuses = [...new Set(DATA.map(d => d.status))];
let activeStatus = "all";
let kw = "";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderPills() {
  const all = [{ key: "all", label: "全部" }, ...statuses.map(s => ({ key: s, label: STATUS_LABEL[s] || s }))];
  pillsBox.innerHTML = all.map(p =>
    `<button class="pill${p.key === activeStatus ? " on" : ""}" data-s="${p.key}">${p.label}</button>`).join("");
}

const BANDS = [
  { key: 0, label: "优先级 1 · 冲量 / 快速消耗" },
  { key: 1, label: "优先级 2–4 · 首选档" },
  { key: 2, label: "优先级 5–7 · 次选档" },
  { key: 3, label: "优先级 8–9 · 三选档" },
  { key: 4, label: "优先级 10 · 待定" },
  { key: 5, label: "无模型" },
];
function bandKey(p) {
  if (p == null) return 4;
  if (p === 1) return 0;
  if (p <= 4) return 1;
  if (p <= 7) return 2;
  if (p <= 9) return 3;
  return 4;
}
const PRIO_CLASS = ["b1", "b2", "b2", "b2", "b3", "b3", "b3", "b4", "b4", "b5"];

function render() {
  const k = kw.trim().toLowerCase();
  const rows = [];
  let shownGroups = 0;

  for (const g of DATA) {
    if (activeStatus !== "all" && g.status !== activeStatus) continue;
    const groupHit = !k || g.name.toLowerCase().includes(k) || g.channel.toLowerCase().includes(k);
    const matchModels = k && !groupHit
      ? g.models.filter(m => m.name.toLowerCase().includes(k) || m.upstream.toLowerCase().includes(k))
      : g.models;
    if (k && !groupHit && matchModels.length === 0) continue;
    shownGroups++;
    if (matchModels.length === 0) { rows.push({ g, m: null }); continue; }
    for (const m of matchModels) rows.push({ g, m });
  }

  rows.sort((a, b) => {
    const ka = a.m ? bandKey(a.m.priority) : 5, kb = b.m ? bandKey(b.m.priority) : 5;
    if (ka !== kb) return ka - kb;
    const pa = a.m?.priority ?? 99, pb = b.m?.priority ?? 99;
    if (pa !== pb) return pa - pb;
    if (a.g.name !== b.g.name) return a.g.name.localeCompare(b.g.name, "zh");
    return (a.m?.name || "").localeCompare(b.m?.name || "");
  });

  const bandCount = {};
  for (const r of rows) bandCount[r.m ? bandKey(r.m.priority) : 5] = (bandCount[r.m ? bandKey(r.m.priority) : 5] || 0) + 1;

  const html = [];
  let lastBand = -1;
  for (const { g, m } of rows) {
    const bk = m ? bandKey(m.priority) : 5;
    if (bk !== lastBand) {
      lastBand = bk;
      html.push(`<tr class="band"><td colspan="8">${BANDS[bk].label} · ${bandCount[bk]} 条</td></tr>`);
    }
    const dis = g.status !== "available" ? " disabled-row" : "";
    const head =
      `<td class="supplier"><span class="name">${esc(g.name)}</span>` +
      (g.base_url ? `<span class="url" title="${esc(g.base_url)}">${esc(g.base_url)}</span>` : "") + `</td>` +
      `<td class="channel"><span class="chan">${esc(g.channel)}</span></td>` +
      `<td class="status"><span class="badge ${g.status}">${STATUS_LABEL[g.status] || esc(g.status)}</span></td>`;
    if (!m) {
      html.push(`<tr class="${dis}">${head}<td colspan="5"><span class="none">无模型</span></td></tr>`);
      continue;
    }
    const cls = m.priority != null ? (PRIO_CLASS[m.priority - 1] || "b5") : "";
    const cells = `<td class="model">${esc(m.name)}</td><td class="model"><span class="up">${esc(m.upstream)}</span></td>` +
      `<td class="model num">${m.priority != null ? `<span class="prio ${cls}">${m.priority}</span>` : "—"}</td><td class="model num">${m.weight ?? "—"}</td>` +
      `<td class="model">${m.effort ? `<span class="effort">${esc(m.effort)}</span>` : `<span class="none">默认</span>`}</td>`;
    html.push(`<tr class="${dis}">${head}${cells}</tr>`);
  }

  tbody.innerHTML = html.join("") ||
    `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--faint)">没有匹配的供应商或模型</td></tr>`;
  meta.textContent = `显示 ${shownGroups} / ${DATA.length} 个供应商 · ${rows.length} 条模型映射`;
}

const avail = DATA.filter(d => d.status === "available").length;
const disab = DATA.filter(d => d.status === "disabled").length;
const totalModels = DATA.reduce((s, d) => s + d.models.length, 0);
document.getElementById("summary").innerHTML =
  `共 <b>${DATA.length}</b> 个供应商（<b>${avail}</b> 可用 / <b>${disab}</b> 禁用），` +
  `<b>${totalModels}</b> 条模型映射`;

q.addEventListener("input", e => { kw = e.target.value; render(); });
pillsBox.addEventListener("click", e => {
  const b = e.target.closest(".pill");
  if (!b) return;
  activeStatus = b.dataset.s;
  renderPills(); render();
});

renderPills();
render();
</script>
