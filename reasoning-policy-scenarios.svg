<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
<defs><style>
.bg{fill:#f6f7fb}.title{font:700 32px sans-serif;fill:#172033}.sub{font:16px sans-serif;fill:#5d687c}.card{fill:#fff;stroke:#dfe4ee;stroke-width:1.5}.h{font:700 21px sans-serif;fill:#172033}.l{font:700 14px sans-serif;fill:#68758a}.b{font:16px sans-serif;fill:#29354a}.m{font:14px monospace;fill:#24324a}.ok{fill:#e8f7ef;stroke:#a8dfbf}.ot{fill:#176b3b}.bad{fill:#fff0f0;stroke:#efb4b4}.bt{fill:#a52b2b}.line{stroke:#9aa8bc;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#9aa8bc"/></marker></defs>
<rect class="bg" width="1600" height="1440"/>
<text x="80" y="70" class="title">推理策略：实际请求会发生什么</text><text x="80" y="103" class="sub">每个例子都按照“客户端请求 → 调度中心设置 → 上游请求 → 最终结果”展开</text>
<text x="92" y="155" class="l">① 用户输入</text><text x="430" y="155" class="l">② 调度设置</text><text x="790" y="155" class="l">③ 发给上游</text><text x="1260" y="155" class="l">④ 结果</text>

<rect x="60" y="180" width="1480" height="190" rx="16" class="card"/><rect x="60" y="180" width="10" height="190" rx="5" fill="#4776e6"/>
<text x="92" y="215" class="h">场景 1 · OpenAI Chat：客户端没有推理字段</text><text x="92" y="250" class="l">用户输入</text><text x="92" y="276" class="m">messages=[...], model="gpt-5.4"</text><text x="92" y="302" class="b">请求中没有 reasoning_effort，也没有 enable_thinking</text><path d="M370 270H420" class="line"/><text x="442" y="250" class="l">调度设置</text><text x="442" y="279" class="b">该条目覆盖为 low</text><text x="442" y="306" class="b">调度中心拥有最终优先级</text><path d="M710 270H770" class="line"/><text x="792" y="250" class="l">发给上游</text><text x="792" y="277" class="m">"reasoning_effort":"low"</text><text x="792" y="304" class="b">只注入该协议定义的字段</text><path d="M1170 270H1240" class="line"/><rect x="1260" y="230" width="230" height="78" rx="12" class="ok"/><text x="1280" y="260" class="b ot">上游接受请求</text><text x="1280" y="287" class="b ot">按 low 执行推理</text>

<rect x="60" y="395" width="1480" height="190" rx="16" class="card"/><rect x="60" y="395" width="10" height="190" rx="5" fill="#4776e6"/>
<text x="92" y="430" class="h">场景 2 · OpenAI Chat：客户端已有开关和嵌套 effort</text><text x="92" y="465" class="l">用户输入</text><text x="92" y="492" class="m">enable_thinking=true</text><text x="92" y="518" class="m">chat_template_kwargs.enable_thinking=false</text><path d="M370 490H420" class="line"/><text x="442" y="465" class="l">调度设置</text><text x="442" y="494" class="b">该条目覆盖为 none</text><text x="442" y="521" class="b">已有布尔开关会同步</text><path d="M710 490H770" class="line"/><text x="792" y="465" class="l">发给上游</text><text x="792" y="492" class="m">enable_thinking=false</text><text x="792" y="518" class="m">chat_template_kwargs.enable_thinking=false</text><path d="M1170 490H1240" class="line"/><rect x="1260" y="450" width="230" height="78" rx="12" class="ok"/><text x="1280" y="480" class="b ot">请求保持一致</text><text x="1280" y="507" class="b ot">关闭思考开关</text>

<rect x="60" y="610" width="1480" height="190" rx="16" class="card"/><rect x="60" y="610" width="10" height="190" rx="5" fill="#8a5de8"/>
<text x="92" y="645" class="h">场景 3 · Anthropic：客户端已启用 thinking，调度设置 low</text><text x="92" y="680" class="l">用户输入</text><text x="92" y="708" class="m">thinking.type="enabled", max_tokens=4096</text><path d="M370 700H420" class="line"/><text x="442" y="680" class="l">调度设置</text><text x="442" y="709" class="b">该条目覆盖为 low</text><text x="442" y="736" class="b">不切换 thinking 模式</text><path d="M710 700H770" class="line"/><text x="792" y="680" class="l">发给上游</text><text x="792" y="707" class="m">thinking.type="enabled"</text><text x="792" y="733" class="m">budget_tokens=1484</text><text x="792" y="759" class="b">预算来自已有 effort 映射且小于 max_tokens</text><path d="M1170 700H1240" class="line"/><rect x="1260" y="660" width="230" height="78" rx="12" class="ok"/><text x="1280" y="690" class="b ot">协议有效</text><text x="1280" y="717" class="b ot">上游按 low 思考</text>

<rect x="60" y="825" width="1480" height="190" rx="16" class="card"/><rect x="60" y="825" width="10" height="190" rx="5" fill="#ef9b3d"/>
<text x="92" y="860" class="h">场景 4 · Gemini 3：客户端同时带 level 和 budget</text><text x="92" y="895" class="l">用户输入</text><text x="92" y="923" class="m">thinkingLevel="LOW", thinkingBudget=900</text><path d="M370 915H420" class="line"/><text x="442" y="895" class="l">调度设置</text><text x="442" y="924" class="b">该条目覆盖为 high</text><text x="442" y="951" class="b">Gemini 3 使用 level 控制面</text><path d="M710 915H770" class="line"/><text x="792" y="895" class="l">发给上游</text><text x="792" y="922" class="m">thinkingLevel="high"</text><text x="792" y="949" class="b">thinkingBudget 被删除</text><text x="792" y="976" class="b">按目标模型支持的 level 校准</text><path d="M1170 915H1240" class="line"/><rect x="1260" y="875" width="230" height="78" rx="12" class="ok"/><text x="1280" y="905" class="b ot">避免双控制面冲突</text><text x="1280" y="932" class="b ot">上游请求有效</text>

<rect x="60" y="1040" width="1480" height="190" rx="16" class="card"/><rect x="60" y="1040" width="10" height="190" rx="5" fill="#ef9b3d"/>
<text x="92" y="1075" class="h">场景 5 · Gemini 2.5：调度设置 low</text><text x="92" y="1110" class="l">用户输入</text><text x="92" y="1138" class="m">thinkingLevel="high", maxOutputTokens=4096</text><path d="M370 1130H420" class="line"/><text x="442" y="1110" class="l">调度设置</text><text x="442" y="1139" class="b">该条目覆盖为 low</text><text x="442" y="1166" class="b">Gemini 2.5 使用 budget 控制面</text><path d="M710 1130H770" class="line"/><text x="792" y="1110" class="l">发给上游</text><text x="792" y="1137" class="m">thinkingBudget=3686</text><text x="792" y="1164" class="b">thinkingLevel 被删除</text><text x="792" y="1191" class="b">预算复用现有模型范围和映射</text><path d="M1170 1130H1240" class="line"/><rect x="1260" y="1090" width="230" height="78" rx="12" class="ok"/><text x="1280" y="1120" class="b ot">避免 level/budget 冲突</text><text x="1280" y="1147" class="b ot">上游请求有效</text>

<rect x="60" y="1255" width="1480" height="130" rx="16" class="bad"/><rect x="60" y="1255" width="10" height="130" rx="5" fill="#d94b4b"/>
<text x="92" y="1290" class="h">场景 6 · Gemini：用户想选择 none</text><text x="92" y="1323" class="b">调度页不会显示 none；旧数据或手工 PATCH 也会被后端拒绝。</text><text x="92" y="1351" class="m bt">HTTP 400 · reasoning_policy_conflict</text><text x="790" y="1323" class="b bt">不发送上游请求</text><text x="1260" y="1323" class="b bt">Gemini 思考无法被可靠关闭</text>
<text x="80" y="1415" class="sub">原则：调度策略覆盖客户端同一推理字段；发现协议冲突时优先保持协议有效，且不猜测预算或强行切换模式。</text>
</svg>
