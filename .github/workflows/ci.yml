name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 竖线分隔在任何错误（含网络错误）时回退到下一个源；默认的逗号只在
# 404/410 时回退，proxy.golang.org 瞬时故障会直接让整个 job 失败。
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build web UI
        uses: ./.github/actions/web-ci

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          # go-format-check:start
          formatted_files="$(gofmt -l .)"
          test -z "${formatted_files}"
          # go-format-check:end

      - name: Check module graph
        run: go mod tidy -diff

      - name: Check embedded CPA bridge module
        working-directory: third_party/cpaembedded
        run: |
          go mod tidy -diff
          go vet ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -o gpt-load .

      - name: Check repository invariants
        run: git diff --check

  race-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark race-instrumented Go cache scope
        # race-tests、test、database-contract(*) 默认共用同一个基于 go.sum 的
        # setup-go 缓存 key；命中即不保存，race-instrumented GOCACHE 永远无法
        # 写回，每次都要重新编译。加入这个 marker 文件参与 cache-dependency-path
        # 哈希，让 race-tests 拥有独立 key 命名空间。
        run: echo race-tests > .go-cache-scope

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-cache-scope

      - name: Run race-enabled tests
        run: go test -race -count=1 -timeout=15m . ./internal/...

  race-cpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: third_party/cpaembedded/go.sum

      - name: Run embedded CPA bridge race-enabled tests
        working-directory: third_party/cpaembedded
        run: go test -race -count=1 -timeout=15m ./...

  database-contract:
    name: Database contract (${{ matrix.driver }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - driver: postgres
            dsn: postgres://postgres:postgres@127.0.0.1:5432/gpt_load?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpt_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gpt_load"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run external database contract
        env:
          GPT_LOAD_DATABASE_TEST_DSN: ${{ matrix.dsn }}
        run: |
          go test -v -count=1 ./internal/storage ./internal/control ./internal/requestlog -run '^TestExternal'
